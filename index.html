<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Should I Put My Tree Up?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transition: background 0.5s ease;
        }

        body.too-early {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        body.yes {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body.after-christmas {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }

        h1 {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            opacity: 0.9;
            margin-top: 1rem;
            line-height: 1.6;
        }

        .date {
            font-size: 1rem;
            opacity: 0.7;
            margin-top: 2rem;
            font-weight: 300;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }

            .subtitle {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="answer">...</h1>
        <p class="subtitle" id="subtitle"></p>
        <p class="date" id="date"></p>
    </div>

    <script>
        function shouldPutTreeUp() {
            const now = new Date();
            const month = now.getMonth(); // 0 = January, 11 = December
            const day = now.getDate();
            
            // Format date for display
            const dateStr = now.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.getElementById('date').textContent = dateStr;

            // November (month 10) is too early
            if (month < 10) {
                // Before November
                document.body.className = 'too-early';
                document.getElementById('answer').textContent = 'NO';
                document.getElementById('subtitle').textContent = 'Way too early! November is too soon for Christmas trees. Come back in December.';
            } else if (month === 10) {
                // November - definitely too early
                document.body.className = 'too-early';
                document.getElementById('answer').textContent = 'NO';
                document.getElementById('subtitle').textContent = 'November is too soon! No Christmas trees until December.';
            } else if (month === 11) {
                // December - check if it's after Christmas
                if (day >= 26) {
                    document.body.className = 'after-christmas';
                    document.getElementById('answer').textContent = 'TAKE IT DOWN';
                    document.getElementById('subtitle').textContent = 'Christmas is over! Time to take down the tree.';
                } else {
                    // December 1-25
                    document.body.className = 'yes';
                    document.getElementById('answer').textContent = 'YES';
                    document.getElementById('subtitle').textContent = 'It\'s December! Your tree should definitely be up. 🎄';
                }
            } else {
                // After December (January onwards)
                document.body.className = 'after-christmas';
                document.getElementById('answer').textContent = 'NO';
                document.getElementById('subtitle').textContent = 'Christmas is over! If your tree is still up, take it down!';
            }
        }

        // Run on page load
        shouldPutTreeUp();
    </script>
</body>
</html>
